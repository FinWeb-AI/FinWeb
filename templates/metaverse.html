{% extends "base.html" %}
{% block title %}元宇宙新聞 – FinWeb{% endblock %}

{% block content %}
<div class="position-relative" style="z-index:10000">
  <div class="d-flex mb-3">
    <input id="mv-input" type="text" class="form-control me-2" placeholder="輸入標的：如 2330 或 台積電">
    <button class="btn btn-success me-2" onclick="searchNews()">搜尋</button>
    <button id="mode-btn" class="btn btn-info me-2">自動模式</button>
    <button id="voice-btn" class="btn btn-outline-light" title="語音搜尋">
      <i class="fas fa-microphone"></i>
    </button>
  </div>
</div>

<div id="mv-container"></div>

<div id="news-sidebar">
  <!-- 收合/展開按鈕 -->
  <div id="sidebar-controls">
    <button id="sidebar-collapse" title="收合"><i class="fas fa-chevron-right"></i></button>
    <button id="sidebar-expand"   title="展開"><i class="fas fa-chevron-left"></i></button>
  </div>
  <!-- 可滾動的內容 -->
  <div id="sidebar-content">
    <!-- JavaScript 會動態塞入 .item 列表 -->
  </div>
</div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index:10000">
  <div id="toast-loading" class="toast align-items-center text-white bg-dark border-0" role="alert"
       aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">搜尋中...</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<style>
  /* 3D 畫布 */
  #mv-container {
    position: fixed; inset:70px 0 0 0;
    background:#151520; overflow:hidden; z-index:0;
  }
  #mv-container canvas,
  #mv-container > div {
    position:absolute; top:0; left:0; z-index:1;
  }

  /* 新聞側欄 */
  #news-sidebar {
    position: fixed; top:90px; right:0;
    width:260px; height:calc(100% - 100px);
    background:rgba(0,0,0,.6); color:#fff;
    padding:10px; z-index:10001;
    font-size:14px; transition: width .3s ease;
  }
  /* 收合寬度只留按鈕 */
  #news-sidebar.collapsed {
    width:32px;
  }

  /* 收合/展開按鈕 */
  #sidebar-controls {
    position: absolute;
    top:50%; transform:translateY(-50%);
    left:0;
    display:flex; flex-direction:column; gap:4px;
    z-index:10002;
  }
  /* 收合時把按鈕推到外面 */
  #news-sidebar.collapsed #sidebar-controls {
    left:-32px;
  }
  #sidebar-controls button {
    width:28px; height:28px;
    background:rgba(255,255,255,.1); border:none;
    border-radius:4px; color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #sidebar-controls button:hover {
    background:rgba(255,255,255,.2);
  }

  /* 內容區可滾動 */
  #sidebar-content {
    height: calc(100% - 20px);   /* 扣掉上下 padding 各 10px */
    overflow-y: auto;
    margin-top:8px;
    transition: opacity .3s ease;
  }
  #news-sidebar.collapsed #sidebar-content {
    opacity:0; pointer-events:none;
  }

  /* 列表項目 */
  #sidebar-content .item {
    margin-bottom:6px; padding:6px 8px;
    border-radius:4px; cursor:pointer;
  }
  #sidebar-content .item:hover {
    background:rgba(255,255,255,.1);
  }

  /* CSS3D 卡片 */
  .news-card {
    width:280px; display:flex; flex-direction:column;
    background:#000; color:#fff; border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,.6);
    overflow:hidden; cursor:pointer;
  }
  .news-card img.news-img {
    width:100%; height:140px; object-fit:cover;
  }
  .news-card .overlay {
    backdrop-filter:blur(4px);
    background:rgba(0,0,0,.55);
    padding:10px; border-radius:0 0 8px 8px;
  }
  .news-card .overlay h6 {
    font-size:16px; margin:0 0 .3rem;
  }
  .news-card .overlay small {
    font-size:12px; color:#ccc;
  }
</style>

<script type="module">
import * as THREE from "three";
import { CSS3DRenderer, CSS3DObject } from "three/examples/jsm/renderers/CSS3DRenderer.js";
import { OrbitControls }               from "three/examples/jsm/controls/OrbitControls.js";
import { DragControls }                from "three/examples/jsm/controls/DragControls.js";
import TWEEN                           from "https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js";

// UI 元件
const input       = document.getElementById("mv-input");
const modeBtn     = document.getElementById("mode-btn");
const toast       = new bootstrap.Toast(document.getElementById("toast-loading"));
const wrap        = document.getElementById("mv-container");
const sidebar     = document.getElementById("news-sidebar");
const sbContent   = document.getElementById("sidebar-content");
const btnCollapse = document.getElementById("sidebar-collapse");
const btnExpand   = document.getElementById("sidebar-expand");

// 綁定收合/展開
if (btnCollapse && btnExpand) {
  btnCollapse.addEventListener("click", ()=> sidebar.classList.add("collapsed"));
  btnExpand.addEventListener("click",   ()=> sidebar.classList.remove("collapsed"));
}

// Three.js 初始化
let W = wrap.clientWidth, H = wrap.clientHeight;
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, W/H, 1, 12000);
camera.position.set(0, 500, 3000);

const gl = new THREE.WebGLRenderer({ antialias:true, alpha:true });
gl.setSize(W, H); wrap.appendChild(gl.domElement);
gl.domElement.style.pointerEvents = "none";

const cssRenderer = new CSS3DRenderer();
cssRenderer.setSize(W, H);
cssRenderer.domElement.style.position = "absolute";
cssRenderer.domElement.style.inset    = "0";
wrap.appendChild(cssRenderer.domElement);

const controls = new OrbitControls(camera, cssRenderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = .1;
controls.enablePan       = false;
controls.minDistance     = 1;
controls.maxDistance     = Infinity;

// 模式切換
let isAuto = true, dragCtrl = null;
const panels = [];

function updateMode(){
  if (isAuto) {
    modeBtn.innerText   = "自動模式";
    controls.enabled    = false;
    controls.enableZoom = false;
    cameraFly();
  } else {
    modeBtn.innerText   = "手動模式";
    controls.enabled    = true;
    controls.enableZoom = true;
  }
}
modeBtn.addEventListener("click", ()=>{
  isAuto = !isAuto;
  if (!isAuto) TWEEN.removeAll();
  updateMode();
});
controls.addEventListener("start", ()=>{
  isAuto = false;
  updateMode();
});

// 窗口縮放
window.addEventListener("resize", ()=>{
  W = wrap.clientWidth; H = wrap.clientHeight;
  camera.aspect = W/H; camera.updateProjectionMatrix();
  gl.setSize(W, H);
  cssRenderer.setSize(W, H);
});

// 節點與連線設定（同原本程式）……
const NODE = 300;
const nodes = [];
for(let i=0;i<NODE;i++){
  nodes.push(new THREE.Vector3(
    (Math.random()-.5)*8000,
    (Math.random()-.5)*5000,
    (Math.random()-.5)*8000
  ));
}
const linkIdx = [], deg=new Array(NODE).fill(0);
while(linkIdx.length/2 < NODE*10){
  const a=Math.floor(Math.random()*NODE), b=Math.floor(Math.random()*NODE);
  if(a!==b && nodes[a].distanceTo(nodes[b])<3000){
    linkIdx.push(a,b); deg[a]++; deg[b]++;
  }
}
const links=[];
for(let i=0;i<linkIdx.length;i+=2){
  const A=nodes[linkIdx[i]], B=nodes[linkIdx[i+1]];
  links.push(A.x,A.y,A.z, B.x,B.y,B.z);
}
const baseGroup=new THREE.Group();
(() => {
  const geo=new THREE.BufferGeometry(), cnt=10000;
  const pos=new Float32Array(cnt*3);
  for(let i=0;i<pos.length;i++) pos[i]=(Math.random()-.5)*10000;
  geo.setAttribute("position", new THREE.BufferAttribute(pos,3));
  baseGroup.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:.9})));
})();
{
  const lg=new THREE.BufferGeometry();
  lg.setAttribute("position", new THREE.Float32BufferAttribute(links,3));
  baseGroup.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0xffffff,opacity:.15,transparent:true})));
  baseGroup.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints(nodes),new THREE.PointsMaterial({color:0xffffff,size:4})));
}
const tileSize=9000, tileGroups=[];
[-1,0,1].forEach(x=>[-1,0,1].forEach(z=>{
  const g=(x===0&&z===0)? baseGroup: baseGroup.clone();
  scene.add(g);
  tileGroups.push({g,offset:new THREE.Vector3(x*tileSize,0,z*tileSize)});
}));
const sorted=[...Array(NODE).keys()].sort((a,b)=>deg[b]-deg[a]);
const topNodes=sorted.slice(0, Math.min(100,NODE));

// 清除舊面板
function clearPanels(){
  panels.forEach(o=>scene.remove(o));
  panels.length=0;
  sbContent.innerHTML="";
  if (dragCtrl){ dragCtrl.dispose(); dragCtrl=null; }
}

// 建立新聞卡片
function makeCard(d,i){
  const a=document.createElement("a");
  a.href=d.link||"#"; a.target="_blank"; a.rel="noopener noreferrer";
  a.className="news-card";
  a.innerHTML=(d.img?`<img src="${d.img}" class="news-img">`:"")
              +`<div class="overlay"><h6>${d.title}</h6><small>${d.published}</small></div>`;
  a.addEventListener("pointerdown",e=>e.stopPropagation());
  const obj=new CSS3DObject(a);

  const ni=topNodes[i%topNodes.length];
  obj.position.copy(nodes[ni].clone().add(new THREE.Vector3(
    (Math.random()-.5)*200,
    (Math.random()-.5)*200,
    (Math.random()-.5)*200
  )));
  scene.add(obj); panels.push(obj);

  const div=document.createElement("div");
  div.className="item"; div.innerText=d.title;
  div.onclick=()=>flyTo(panels.indexOf(obj));
  sbContent.appendChild(div);
}

// 載入新聞
async function loadNews(sym){
  toast.show(); clearPanels();
  try{
    const res=await fetch(`/api/metaverse_feed?symbol=${encodeURIComponent(sym)}`);
    const data=await res.json();
    if(data.error){ alert(data.error); return; }
    data.forEach((d,i)=>makeCard(d,i));
    dragCtrl=new DragControls(panels,camera,cssRenderer.domElement);
    dragCtrl.addEventListener("dragstart",()=>controls.enabled=false);
    dragCtrl.addEventListener("dragend",()=>controls.enabled=true);
    if(isAuto){ TWEEN.removeAll(); cameraFly(); }
  }catch(e){
    console.error(e); alert("API 錯誤");
  }finally{ toast.hide(); }
}
window.searchNews=()=>{ const v=input.value.trim(); v?loadNews(v):alert("請輸入標的"); };

// 語音搜尋
(()=>{
  const mic=document.getElementById("voice-btn");
  if("SpeechRecognition"in window||"webkitSpeechRecognition"in window){
    const R=window.SpeechRecognition||window.webkitSpeechRecognition;
    const rec=new R(); rec.lang="zh-TW";
    rec.onresult=e=>{ input.value=e.results[0][0].transcript; loadNews(input.value); };
    mic.onclick=()=>rec.start();
  }else mic.style.display="none";
})();

// 自動飛行
function cameraFly(){
  if(!isAuto||panels.length===0)return;
  const idx=Math.floor(Math.random()*panels.length),
        tgt=panels[idx].position.clone(),
        off=new THREE.Vector3((Math.random()-.5)*1200,(Math.random()-.5)*600,(Math.random()-.5)*1200),
        np=tgt.clone().add(off);
  new TWEEN.Tween(camera.position).to({x:np.x,y:np.y,z:np.z},8000)
    .easing(TWEEN.Easing.Sinusoidal.InOut).start();
  new TWEEN.Tween(controls.target).to({x:tgt.x,y:tgt.y,z:tgt.z},8000)
    .easing(TWEEN.Easing.Sinusoidal.InOut).onComplete(cameraFly).start();
}

// 列表飛過去
function flyTo(idx){
  isAuto=false; updateMode();
  const o=panels[idx]; if(!o)return;
  const tp=o.position.clone(), np=tp.clone().add(new THREE.Vector3(0,200,800));
  new TWEEN.Tween(camera.position).to({x:np.x,y:np.y,z:np.z},2000).easing(TWEEN.Easing.Cubic.Out).start();
  new TWEEN.Tween(controls.target).to({x:tp.x,y:tp.y,z:tp.z},2000).easing(TWEEN.Easing.Cubic.Out).start();
}

// 主動畫迴圈
(function animate(t){
  requestAnimationFrame(animate);
  tileGroups.forEach(({g,offset})=>{
    g.position.set(
      offset.x - camera.position.x,
      offset.y - camera.position.y,
      offset.z - camera.position.z
    );
  });
  controls.update(); TWEEN.update(t);
  gl.render(scene,camera);
  cssRenderer.render(scene,camera);
})();
</script>
{% endblock %}
