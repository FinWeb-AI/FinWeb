{% extends "base.html" %}
{% block title %}元宇宙新聞 – FinWeb{% endblock %}

{% block content %}
<div class="position-relative" style="z-index:10000">
  <div class="d-flex mb-3">
    <input id="mv-input" type="text" class="form-control me-2" placeholder="輸入標的：如 2330 或 台積電">
    <button class="btn btn-success me-2" onclick="searchNews()">搜尋</button>

    <button id="mode-btn" class="btn btn-info me-2">自動模式</button>

    <button id="voice-btn" class="btn btn-outline-light" title="語音搜尋">
      <i class="fas fa-microphone"></i>
    </button>
  </div>
</div>

<div id="mv-container"></div>
<div id="news-sidebar"></div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index:10000">
  <div id="toast-loading" class="toast align-items-center text-white bg-dark border-0" role="alert"
       aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">搜尋中...</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<style>
  /* 主視覺容器 */
  #mv-container{
    position:fixed;inset:70px 0 0 0;
    background:#151520;overflow:hidden;z-index:0;
  }
  /* 將 WebGL 與 CSS3D renderer 提升一層，避免被覆蓋 */
  #mv-container canvas,
  #mv-container > div{
    position:absolute;top:0;left:0;z-index:1;
  }

  /* 側邊欄 */
  #news-sidebar{
    position:fixed;top:90px;right:0;
    width:260px;height:calc(100% - 100px);
    background:rgba(0,0,0,.6);color:#fff;
    overflow-y:auto;padding:10px;z-index:10001;font-size:14px;
  }
  #news-sidebar .item{margin-bottom:6px;padding:6px 8px;border-radius:4px;cursor:pointer;}
  #news-sidebar .item:hover{background:rgba(255,255,255,.1);}

  /* 新聞卡 */
  .news-card{
    width:280px;display:flex;flex-direction:column;
    background:#000;color:#fff;border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,.6);overflow:hidden;cursor:pointer;
  }
  .news-card img.news-img{width:100%;height:140px;object-fit:cover;}
  .news-card .overlay{backdrop-filter:blur(4px);background:rgba(0,0,0,.55);padding:10px;border-radius:0 0 8px 8px;}
  .news-card .overlay h6{font-size:16px;margin:0 0 .3rem;}
  .news-card .overlay small{font-size:12px;color:#ccc;}
</style>

<script type="module">
import * as THREE from "three";
import { CSS3DRenderer, CSS3DObject } from "three/examples/jsm/renderers/CSS3DRenderer.js";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
import { DragControls } from "three/examples/jsm/controls/DragControls.js";
import TWEEN from "https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.esm.js";

const input   = document.getElementById("mv-input");
const modeBtn = document.getElementById("mode-btn");
const toast   = new bootstrap.Toast(document.getElementById("toast-loading"));
const wrap    = document.getElementById("mv-container");
const sidebar = document.getElementById("news-sidebar");

let W = wrap.clientWidth, H = wrap.clientHeight;
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, W/H, 1, 12000);
camera.position.set(0,500,3000);

const gl  = new THREE.WebGLRenderer({ antialias:true, alpha:true });
gl.setSize(W,H); wrap.appendChild(gl.domElement);

const css = new CSS3DRenderer();
css.setSize(W,H); css.domElement.style.position="absolute"; css.domElement.style.inset="0";
wrap.appendChild(css.domElement);

const controls = new OrbitControls(camera, css.domElement);
controls.enableDamping = true; controls.dampingFactor = .1;
controls.enablePan = false; controls.minDistance = 800; controls.maxDistance = 6000;

let isAuto = true;
function updateMode(){
  if(isAuto){
    modeBtn.innerText = "自動模式";
    controls.enabled  = false;
    controls.enableZoom = false;
    cameraFly();
  }else{
    modeBtn.innerText = "手動模式";
    controls.enabled  = true;
    controls.enableZoom = true;
  }
}
modeBtn.addEventListener("click",()=>{
  isAuto = !isAuto;
  if(!isAuto) TWEEN.removeAll();
  updateMode();
});

controls.addEventListener("start", ()=>{ isAuto=false; updateMode(); });

window.addEventListener("resize",()=>{
  W = wrap.clientWidth; H = wrap.clientHeight;
  camera.aspect = W/H; camera.updateProjectionMatrix();
  gl.setSize(W,H); css.setSize(W,H);
});

(()=>{
  const g = new THREE.BufferGeometry(), cnt = 5000;
  const pos = new Float32Array(cnt*3);
  for(let i=0;i<pos.length;i++) pos[i]=(Math.random()-.5)*10000;
  g.setAttribute("position", new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:.9 })));
})();

const NODE=200, nodes=[]; // 隨機生成節點
const HALF=12000;
for(let i=0;i<NODE;i++){
  nodes.push(new THREE.Vector3(
    (Math.random()-.5)*8000,
    (Math.random()-.5)*5000,
    (Math.random()-.5)*8000
  ));
}
const links=[], MAXL=NODE*5, MAXD=3000; // 隨機生成連線
while(links.length/6<MAXL){
  const a=nodes[Math.floor(Math.random()*NODE)];
  const b=nodes[Math.floor(Math.random()*NODE)];
  if(a!==b && a.distanceTo(b)<MAXD){
    links.push(a.x,a.y,a.z,b.x,b.y,b.z);
  }
}
const lg=new THREE.BufferGeometry();
lg.setAttribute("position",new THREE.Float32BufferAttribute(links,3));
scene.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0xffffff,opacity:.15,transparent:true})));
scene.add(new THREE.Points(
  new THREE.BufferGeometry().setFromPoints(nodes),
  new THREE.PointsMaterial({color:0xffffff,size:4})
));

const panels=[]; let dragCtrl=null;
function clearPanels(){
  panels.forEach(o=>scene.remove(o));
  panels.length=0; sidebar.innerHTML="";
  if(dragCtrl){ dragCtrl.dispose(); dragCtrl=null; }
}
function makeCard(d,i){
  const card=document.createElement("div");
  card.className="news-card";
  card.innerHTML=(d.img?`<img src="${d.img}" class="news-img">`:"")+
    `<div class="overlay"><h6>${d.title}</h6><small>${d.published}</small></div>`;
  card.onclick=()=>window.open(d.link,"_blank");

  const obj=new CSS3DObject(card);
  obj.position.set(0,0,0); scene.add(obj); panels.push(obj);

  const end = nodes[Math.floor(Math.random()*NODE)];
  new TWEEN.Tween(obj.position)
    .to({x:end.x,y:end.y,z:end.z},1200+i*100)
    .easing(TWEEN.Easing.Quadratic.Out).start();

  const it=document.createElement("div");
  it.className="item"; it.innerText=d.title;
  it.onclick=()=>flyTo(i); sidebar.appendChild(it);
}

async function loadNews(sym){
  toast.show(); clearPanels();
  try{
    const res=await fetch(`/api/metaverse_feed?symbol=${encodeURIComponent(sym)}`);
    const data=await res.json();
    if(data.error){alert(data.error);return;}
    data.forEach((d,i)=>makeCard(d,i));
    dragCtrl=new DragControls(panels,camera,css.domElement);
    dragCtrl.addEventListener("dragstart",()=>controls.enabled=false);
    dragCtrl.addEventListener("dragend",  ()=>controls.enabled=true);
  }catch(e){console.error(e);alert("API 錯誤");}
  finally{toast.hide();}
}
window.searchNews=()=>{
  const v=input.value.trim();
  v? loadNews(v):alert("請輸入標的");
};

(()=>{
  const mic=document.getElementById("voice-btn");
  if("SpeechRecognition"in window||"webkitSpeechRecognition"in window){
    const R=window.SpeechRecognition||window.webkitSpeechRecognition;
    const rec=new R(); rec.lang="zh-TW";
    rec.onresult=e=>{
      input.value=e.results[0][0].transcript; loadNews(input.value);
    };
    mic.onclick=()=>rec.start();
  }else mic.style.display="none";
})();

function cameraFly(){
  if(!isAuto) return;
  const tgt=nodes[Math.floor(Math.random()*NODE)];
  const off=new THREE.Vector3(
    (Math.random()-.5)*1200,
    (Math.random()-.5)*600,
    (Math.random()-.5)*1200
  );
  const np=tgt.clone().add(off);
  new TWEEN.Tween(camera.position)
    .to({x:np.x,y:np.y,z:np.z},8000)
    .easing(TWEEN.Easing.Sinusoidal.InOut).start();
  new TWEEN.Tween(controls.target)
    .to({x:tgt.x,y:tgt.y,z:tgt.z},8000)
    .easing(TWEEN.Easing.Sinusoidal.InOut)
    .onComplete(cameraFly).start();
}
cameraFly();

function flyTo(idx){
  isAuto=false; updateMode();
  const o=panels[idx]; if(!o) return;
  const tp=o.position.clone();
  const np=tp.clone().add(new THREE.Vector3(0,200,800));
  new TWEEN.Tween(camera.position)
    .to({x:np.x,y:np.y,z:np.z},2000)
    .easing(TWEEN.Easing.Cubic.Out).start();
  new TWEEN.Tween(controls.target)
    .to({x:tp.x,y:tp.y,z:tp.z},2000)
    .easing(TWEEN.Easing.Cubic.Out).start();
}

(function animate(t){
  requestAnimationFrame(animate);
  scene.rotation.y+=0.0001;
  controls.update(); TWEEN.update(t);
  gl.render(scene,camera); css.render(scene,camera);
})();
</script>
{% endblock %}
