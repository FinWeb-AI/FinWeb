<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}FinWeb{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- ─── 導航列 ─── -->
  <nav class="navbar navbar-expand-lg shadow-sm fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-light" href="{{ url_for('index') }}">FinWeb</a>
      <button class="navbar-toggler bg-light" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div id="navMenu" class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">即時行情</a></li>

          <!-- 下拉選單：金融 -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">金融工具</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="{{ url_for('ai_analysis') }}">AI 分析</a></li>
              <li><a class="dropdown-item" href="{{ url_for('market_overview') }}">市場概覽</a></li>
              <!-- 預留功能 未來可以增加 -->
            </ul>
          </li>
        </ul>

        <!-- 登入的狀態欄位設計 -->
        <ul class="navbar-nav mb-2 mb-lg-0">
          {% if current_user.is_authenticated %}
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                👤 {{ current_user.username }}
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{{ url_for('assistant') }}">AI 助理面板</a></li>
                <li><a class="dropdown-item" href="{{ url_for('logout') }}">登出</a></li>
              </ul>
            </li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">登入</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('register') }}">註冊</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <!-- ─── 主要內容 ─── -->
  <main class="container pt-5 mt-4">
    {% block content %}{% endblock %}
  </main>

  <!-- ─── 這邊是跟ai助理有關的按鈕 ─── -->
  {% block widget %}
  <button id="chat-toggle" class="chat-btn animate__animated animate__bounceIn" aria-label="開啟 AI 助理">
    <img src="{{ url_for('static', filename='img/assistant-icon.svg') }}" alt="AI" />
  </button>

  <div id="chat-panel" class="chat-panel shadow-lg animate__animated">
    <div class="chat-header d-flex justify-content-between align-items-center">
      <span>FinWeb AI 助理</span>
      <button class="btn-close btn-close-white" id="chat-close" aria-label="Close"></button>
    </div>
    <iframe src="{{ url_for('assistant') }}" title="AI Assistant" class="chat-iframe"></iframe>
  </div>
  {% endblock %}

  <!-- ─── JS ─── -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
