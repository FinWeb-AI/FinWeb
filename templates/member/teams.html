{% extends "member/base_member.html" %}
{% block member_content %}
<h1 class="text-2xl font-bold mb-4">團隊管理</h1>
<form method="POST">
  {{ form.hidden_tag() }}
  <div>{{ form.name.label }} {{ form.name() }}</div>
  <button type="submit" class="btn-primary">{{ form.submit.label.text }}</button>
</form>
<ul class="mt-4">
  {% for t in teams %}
    <li><a href="{{ url_for('member.team_detail', team_id=t.id) }}">{{ t.name }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
