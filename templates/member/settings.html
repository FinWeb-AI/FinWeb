{% extends "member/base_member.html" %}
{% block member_content %}
<h1 class="text-2xl font-bold mb-4">帳戶設定</h1>
<form method="POST">
  {{ form.hidden_tag() }}
  <div>
    {{ form.timezone.label }} {{ form.timezone() }}
  </div>
  <div>
    {{ form.language.label }} {{ form.language() }}
  </div>
  <button type="submit" class="btn-primary">{{ form.submit.label.text }}</button>
</form>
{% endblock %}
