{% extends "base.html" %}
{% block title %}關於我們 – FinWeb{% endblock %}

{% block content %}
<style>
  .about-hero {
    background: linear-gradient(135deg, #2c5364 0%, #0f2027 100%);
    color: #fff;
    padding: 6rem 0;
    text-align: center;
  }
  .mission {
    font-size: 1.25rem;
    color: #ddd;
    margin-top: 1rem;
  }
  .team-card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(8px);
    border: none;
    border-radius: 1rem;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    padding: 2rem;
    text-align: center;
    color: #fff;
    transition: transform .3s;
  }
  .team-card:hover {
    transform: translateY(-6px);
  }
  .team-photo {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    margin-bottom: 1rem;
    border: 3px solid rgba(255,255,255,0.3);
  }
  .team-name {
    font-size: 1.2rem;
    font-weight: 600;
  }
  .team-role {
    font-size: .95rem;
    color: #ccc;
    margin-bottom: 1rem;
  }
  .social-links a {
    color: #fff;
    margin: 0 .5rem;
    font-size: 1.25rem;
    transition: color .2s;
  }
  .social-links a:hover {
    color: #26a69a;
  }
</style>

<section class="about-hero">
  <div class="container">
    <h1 class="animate__animated animate__fadeInDown">關於 FinWeb</h1>
    <p class="animate__animated animate__fadeInUp animate__delay-1s mission">
      我們致力於打造最專業、好用的即時金融資訊平台，結合大數據、AI 與可視化工具，助您做出更聰明的投資決策。
    </p>
  </div>
</section>

<section class="py-5" style="background-color:#16262b;">
  <div class="container">
    <h2 class="section-title text-center text-white mb-5">我們的開發團隊</h2>
    <div class="row g-4 justify-content-center">

      <!-- Niansia -->
      <div class="col-md-4">
        <div class="team-card h-100">
          <img src="{{ url_for('static', filename='img/team/niansia.jpg') }}" alt="niansia" class="team-photo mx-auto d-block">
          <div class="team-name">niansia</div>
          <div class="team-role">機器學習大師 & 開發者</div>
          <p class="text-white-50 mb-3">大佬7122</p>
          <div class="social-links">
            <a href="https://github.com/niansia" target="_blank"><i class="fab fa-github"></i></a>
            <a href="mailto:niansia@example.com"><i class="fas fa-envelope"></i></a>
          </div>
        </div>
      </div>

      <!-- 400Ping -->
      <div class="col-md-4">
        <div class="team-card h-100">
          <img src="{{ url_for('static', filename='img/team/400Ping.jpg') }}" alt="400Ping" class="team-photo mx-auto d-block">
          <div class="team-name">400Ping</div>
          <div class="team-role">專業打雜仔</div>
          <p class="text-white-50 mb-3">大型開源專案貢獻者(打雜仔)</p>
          <div class="social-links">
            <a href="https://github.com/400Ping" target="_blank"><i class="fab fa-github"></i></a>
            <a href="mailto:fourhundredping@gmail.com"><i class="fas fa-envelope"></i></a>
          </div>
        </div>
      </div>

    </div>

    <div class="text-center mt-5">
      <p class="text-white-50">想加入我們？請寄履歷至 <a href="mailto:finwebfinance2025@gmail.com" class="text-white-50">finwebfinance2025@gmail.com</a></p>
      <a href="mailto:finwebfinance2025@gmail.com" class="btn btn-glass btn-lg">加入團隊</a>
    </div>
  </div>
</section>
{% endblock %}
