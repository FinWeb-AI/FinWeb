{% extends 'base.html' %}
{% block title %}Dashboard - FinWeb{% endblock %}
{% block content %}
<h1>即時行情</h1>

<section id="stock-section">
  <h2>股票</h2>
  <form id="stock-form">
    <input type="text" id="stock-symbol" placeholder="輸入代號，例如 TSLA" />
    <button type="submit">查詢</button>
  </form>
  <pre id="stock-result">—</pre>
</section>

<section id="crypto-section">
  <h2>加密貨幣</h2>
  <select id="crypto-select">
    <option value="">請選擇...</option>
  </select>
  <button id="start-btn" disabled>開始更新</button>
  <button id="download-btn" disabled>下載CSV</button>
  <canvas id="crypto-chart" width="400" height="200"></canvas>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const sel = document.getElementById('crypto-select');
  const startBtn = document.getElementById('start-btn');
  const downloadBtn = document.getElementById('download-btn');
  const ctx = document.getElementById('crypto-chart').getContext('2d');
  let chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Price (USD)',
        data: [],
        fill: false,
        borderWidth: 1
      }]
    },
    options: {
      animation: false,
      scales: {
        x: { display: true },
        y: { beginAtZero: false }
      }
    }
  });
  let timer;

  fetch('/api/coins')
    .then(r=>r.json())
    .then(list=>{
      list.forEach(c=>{
        const o = new Option(c.symbol.toUpperCase()+' – '+c.name, c.id);
        sel.add(o);
      });
    });

  sel.addEventListener('change', ()=>{
    chart.data.labels.length = 0;
    chart.data.datasets[0].data.length = 0;
    chart.update();
    startBtn.disabled = !sel.value;
    downloadBtn.disabled = true;
    clearInterval(timer);
    startBtn.textContent = '開始更新';
  });

  startBtn.addEventListener('click', ()=>{
    if(startBtn.textContent==='開始更新'){
      timer = setInterval(()=>{
        fetch(`/api/crypto_price?id=${sel.value}`)
          .then(r=>r.json())
          .then(d=>{
            const t = new Date(d.timestamp);
            chart.data.labels.push(t.toLocaleTimeString());
            chart.data.datasets[0].data.push(d.price);
            chart.update('none');
          });
      }, 1000);
      startBtn.textContent = '停止更新';
      downloadBtn.disabled = false;
    } else {
      clearInterval(timer);
      startBtn.textContent = '開始更新';
    }
  });

  downloadBtn.addEventListener('click', ()=>{
    const labels = chart.data.labels;
    const data = chart.data.datasets[0].data;
    let csv = 'timestamp,price\n';
    labels.forEach((lab,i)=>{
      csv += `${lab},${data[i]}\n`;
    });
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = `${sel.value}_history.csv`;
    a.click();
  });
});
</script>
{% endblock %}
