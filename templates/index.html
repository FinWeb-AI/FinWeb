{% extends 'base.html' %}
{% block title %}Dashboard – FinWeb{% endblock %}

{% block content %}
<h1 class="mb-4">即時行情</h1>

<section id="stock-section" class="mb-5">
  <h2>股票</h2>
  <form id="stock-form" class="d-flex align-items-center">
    <input type="text" id="stock-symbol" class="form-control w-50" placeholder="輸入代號，例如 TSLA" />
    <button class="btn btn-primary ms-2">查詢</button>
  </form>
  <pre id="stock-result" class="mt-2 text-light">—</pre>
</section>

<section id="crypto-section">
  <h2>加密貨幣</h2>
  <div class="mb-3">
    <select id="crypto-select" class="form-select w-auto d-inline-block">
      <option value="">請選擇...</option>
    </select>
    <button id="start-btn" class="btn btn-success ms-2" disabled>開始更新</button>
    <button id="download-btn" class="btn btn-outline-light ms-2" disabled>下載 CSV</button>
  </div>
  <canvas id="crypto-chart" class="border rounded" style="background:#0f1117; width:100%; height:400px;"></canvas>
</section>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function(){
  const sel         = document.getElementById('crypto-select');
  const startBtn    = document.getElementById('start-btn');
  const downloadBtn = document.getElementById('download-btn');
  const ctx         = document.getElementById('crypto-chart').getContext('2d');

  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Price (USD)',
        data: [],
        borderColor: '#2962FF',
        borderWidth: 2,
        tension: 0.1,
        pointRadius: 0
      }]
    },
    options: {
      animation: false,
      scales: {
        x: { display: true },
        y: {
          beginAtZero: false,
          ticks: { color: '#D1D4DC' }
        }
      },
      plugins: {
        legend: { labels: { color: '#D1D4DC' } }
      }
    }
  });

  let timer = null;

  fetch('/api/coins')
    .then(r => r.json())
    .then(list => {
      list.forEach(c => {
        sel.add(new Option(`${c.symbol.toUpperCase()} – ${c.name}`, c.id));
      });
    })
    .catch(console.error);

  sel.addEventListener('change', () => {
    chart.data.labels.length = 0;
    chart.data.datasets[0].data.length = 0;
    chart.update();
    startBtn.disabled = !sel.value;
    downloadBtn.disabled = true;
    clearInterval(timer);
    startBtn.textContent = '開始更新';
  });

  startBtn.addEventListener('click', () => {
    if (startBtn.textContent === '開始更新') {
      timer = setInterval(() => {
        fetch(`/api/crypto_price?id=${sel.value}`)
          .then(r => r.json())
          .then(d => {
            const t = new Date(d.timestamp);
            chart.data.labels.push(t.toLocaleTimeString());
            chart.data.datasets[0].data.push(d.price);
            chart.update('none');
          })
          .catch(console.error);
      }, 1000);
      startBtn.textContent = '停止更新';
      downloadBtn.disabled = false;
    } else {
      clearInterval(timer);
      startBtn.textContent = '開始更新';
    }
  });

  downloadBtn.addEventListener('click', () => {
    const labels = chart.data.labels;
    const data   = chart.data.datasets[0].data;
    let csv = 'timestamp,price\n';
    labels.forEach((lab, i) => {
      csv += `${lab},${data[i]}\n`;
    });
    const blob = new Blob([csv], { type:'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `${sel.value}_history.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  window.addEventListener('resize', () => {
    chart.resize();
  });
});
</script>
{% endblock %}
