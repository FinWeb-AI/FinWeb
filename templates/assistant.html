<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinWeb AI 助理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin:0; padding:0;
      background:#202226; color:#fff;
      display:flex; flex-direction:column;
      height:100vh; font-family:sans-serif;
    }
    .chat-body {
      flex:1; overflow-y:auto; padding:1rem;
    }
    .chat-input {
      display:flex; background:#181a1f;
      padding:0.5rem; gap:0.5rem;
    }
    .chat-input input {
      flex:1; padding:0.5rem; border:none;
      border-radius:4px; background:#2a2e37; color:#fff;
    }
    .chat-input button {
      padding:0.5rem 1rem; border:none;
      border-radius:4px; background:#26a69a; color:#fff;
    }
    .msg { margin-bottom:0.75rem; max-width:80%; padding:0.5rem 0.75rem; border-radius:4px; line-height:1.4; }
    .msg.user { background:#26a69a; margin-left:auto; }
    .msg.bot  { background:#2a2e37; margin-right:auto; }
  </style>
</head>
<body>
  <!-- **注意：已移除整個 chat-header ** -->
  <div id="chat-body" class="chat-body"></div>
  <div class="chat-input">
    <input id="chat-input" type="text" placeholder="輸入問題…" autocomplete="off" />
    <button id="chat-send">送出</button>
  </div>

  <script>
    const bodyEl = document.getElementById('chat-body');
    const inEl   = document.getElementById('chat-input');
    const send   = document.getElementById('chat-send');

    function append(text, who){
      const d = document.createElement('div');
      d.className = 'msg '+who;
      d.textContent = text;
      bodyEl.appendChild(d);
      bodyEl.scrollTop = bodyEl.scrollHeight;
    }

    function sendMsg(){
      const txt = inEl.value.trim();
      if(!txt) return;
      append(txt,'user');
      inEl.value='';
      fetch('/api/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:txt})
      })
      .then(r=>r.json())
      .then(j=>append(j.reply,'bot'))
      .catch(_=>append('系統錯誤，請稍後再試。','bot'));
    }

    send.onclick = sendMsg;
    inEl.onkeydown = e=>{ if(e.key==='Enter') sendMsg(); };
  </script>
</body>
</html>
