{% extends "base.html" %}
{% block title %}社群情緒雷達 – FinWeb{% endblock %}

{% block content %}
<h1 class="mb-4 text-white">社群情緒雷達</h1>
<div class="row g-4">
  <div class="col-lg-4">
    <div class="card bg-dark text-light h-100">
      <div class="card-header bg-secondary">
        <div class="d-flex align-items-center">
          <input id="kw-input" class="form-control form-control-sm me-2" placeholder="關鍵字">
          <button id="btn-search" class="btn btn-sm btn-success">搜尋</button>
        </div>
        <div class="mt-2">
          <label class="me-1">時間：</label>
          <select id="time-select" class="form-select form-select-sm d-inline-block w-auto">
            <option value="12h">12 小時</option>
            <option value="1d">1 天</option>
            <option value="3d">3 天</option>
            <option value="7d">7 天</option>
            <option value="1w">1 週</option>
          </select>
        </div>
      </div>
      <div class="card-body">
        <div id="trending-keywords" class="mb-3"></div>
        <canvas id="radar-chart" width="420" height="420" style="max-width:100%;max-height:100%;"></canvas>
      </div>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="card bg-dark text-light mb-3">
      <div class="card-header">文字雲 (WordCloud)</div>
      <div class="card-body p-0" style="height:550px;">
        <canvas id="wc-canvas" width="1200" height="550" style="width:100%;height:100%;"></canvas>
      </div>
    </div>
    <div class="card bg-dark text-light">
      <div class="card-header d-flex justify-content-between">
        <span>最新貼文</span><small id="last-update">--:--:--</small>
      </div>
      <ul id="feed-list"
          class="list-group list-group-flush bg-dark"
          style="max-height:420px;overflow-y:auto;"></ul>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>

function ensureWordCloud() {
  return new Promise(res => {
    if (window.WordCloud) return res();
    const cdns = [
      "https://cdn.jsdelivr.net/npm/wordcloud@1.2.6/dist/wordcloud2.js",
      "https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"
    ];
    let idx = 0;
    (function tryLoad() {
      if (idx >= cdns.length) {
        console.error("無法載入 wordcloud2.js");
        return res();
      }
      const s = document.createElement("script");
      s.src = cdns[idx++];
      s.onload = () => {
        console.log("載入 wordcloud2.js 成功:", s.src);
        res();
      };
      s.onerror = () => {
        console.warn("載入失敗，嘗試下一個 CDN…");
        tryLoad();
      };
      document.head.appendChild(s);
    })();
  });
}

(async () => {
  const $ = id => document.getElementById(id);
  const kw    = $("kw-input"),
        btn   = $("btn-search"),
        tm    = $("time-select"),
        trend = $("trending-keywords"),
        feed  = $("feed-list"),
        wc    = $("wc-canvas"),
        last  = $("last-update");

  const radar = new Chart($("radar-chart").getContext("2d"), {
    type: "polarArea",
    data: {
      labels: ["Positive","Neutral","Negative"],
      datasets: [{
        data: [0,0,0],
        backgroundColor: ["#26a69a","#9e9e9e","#ef5350"]
      }]
    },
    options: {
      scales: { r: {
        beginAtZero:true, max:1,
        ticks:{ callback: v=> (v*100).toFixed(0)+"%", stepSize:0.25, color:"#ccc" },
        grid:{ color:"rgba(255,255,255,0.1)" },
        angleLines:{ color:"rgba(255,255,255,0.2)" },
        pointLabels:{ color:"#fff" }
      }},
      plugins:{ legend:{ labels:{ color:"#fff" } } }
    }
  });

  ["Bitcoin","Ethereum","2330","TSMC","AI"].forEach(t => {
    const b = document.createElement("span");
    b.className = "badge bg-secondary me-1 mb-1";
    b.textContent = t; b.style.cursor = "pointer";
    b.onclick = () => { kw.value = t; fetchData(); };
    trend.appendChild(b);
  });

  async function fetchData() {
    const q = kw.value.trim() || "bitcoin";
    const res = await fetch(`/api/sentiment_feed?q=${encodeURIComponent(q)}&timerange=${tm.value}`);
    const { posts, tokens } = await res.json();

    console.log("DEBUG tokens:", tokens);

    let P=0,Z=0,N=0;
    feed.innerHTML = "";
    posts.forEach(p => {
      P += p.positive; Z += p.neutral; N += p.negative;
      const li = document.createElement("li");
      li.className = "list-group-item bg-dark text-light";
      li.style.borderLeft = p.positive >= p.negative
        ? "4px solid #26a69a" : "4px solid #ef5350";
      li.textContent = p.text;
      li.onclick = () => window.open(p.link,"_blank");
      feed.appendChild(li);
    });
    const cnt = posts.length || 1;
    radar.data.datasets[0].data = [P/cnt, Z/cnt, N/cnt];
    radar.update();

    await ensureWordCloud();
    if (typeof WordCloud !== "function") {
      console.error("WordCloud 尚未定義，無法繪製字雲");
      return;
    }
    const ctx = wc.getContext("2d");
    ctx.clearRect(0,0,wc.width,wc.height);

    if (tokens && tokens.length) {
      WordCloud(wc, {
        list: tokens,
        gridSize: 4,
        weightFactor: w => w * wc.width / 20,
        minFontSize: 32,
        backgroundColor: "#202226",
        fontFamily: "sans-serif",
        color: (word, weight) => weight > wc.width*0.5
                                 ? "#26a69a" : "#ccc",
        rotateRatio: 0.1,
        minRotation: 0,
        maxRotation: 0,
        drawOutOfBound: true
      });
    }
    last.textContent = new Date().toLocaleTimeString();
  }

  btn.onclick = fetchData;
  kw.addEventListener("keypress", e => { if (e.key==="Enter") fetchData(); });
  tm.onchange = fetchData;

  fetchData();
  setInterval(fetchData, 60_000);
})();
</script>
{% endblock %}
