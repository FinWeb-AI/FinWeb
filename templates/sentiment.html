{% extends "base.html" %}
{% block title %}情緒雷達 – FinWeb{% endblock %}

{% block content %}
<h1 class="mb-4">社群情緒雷達</h1>

<div class="row g-4">
  <div class="col-lg-4">
    <div class="card bg-dark text-light h-100">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span id="keyword-label">#Bitcoin</span>
        <input id="keyword-input" class="form-control form-control-sm w-50" placeholder="關鍵詞">
      </div>
      <div class="card-body d-flex align-items-center justify-content-center">
        <canvas id="sentiment-chart" width="280" height="280"></canvas>
      </div>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="card bg-dark text-light mb-3">
      <div class="card-header">熱門關鍵字</div>
      <div class="card-body p-0" style="height:230px;">
        <canvas id="wc-canvas" height="230"></canvas>
      </div>
    </div>

    <div class="card bg-dark text-light">
      <div class="card-header d-flex justify-content-between">
        <span>最新貼文</span>
        <span class="small text-muted" id="last-update">--:--:--</span>
      </div>
      <ul class="list-group list-group-flush" id="feed-list" style="max-height:300px;overflow-y:auto;"></ul>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.6/src/wordcloud2.js"></script>

<script>
const ctx = document.getElementById('sentiment-chart').getContext('2d');
const rose = new Chart(ctx,{
  type:'polarArea',
  data:{labels:['Positive','Neutral','Negative'],
        datasets:[{data:[1,1,1], backgroundColor:['#26a69a','#9e9e9e','#ef5350']}]},
  options:{plugins:{legend:{labels:{color:'#fff'}}}}
});

const kwInput = document.getElementById('keyword-input');
const kwLabel = document.getElementById('keyword-label');
kwInput.addEventListener('keypress', e=>{
  if(e.key==='Enter' && kwInput.value.trim()){
    kwLabel.textContent = '#'+kwInput.value.trim();
    fetchData();
  }
});

async function fetchData(){
  const q = kwInput.value.trim()||'bitcoin';
  const res= await fetch(`/api/sentiment_feed?q=${encodeURIComponent(q)}`);
  const rows= await res.json();
  if(!rows.length) return;

  let pos=0,neu=0,neg=0,cloud=[];
  const list = document.getElementById('feed-list');
  list.innerHTML='';
  rows.forEach(r=>{
    pos+=r.positive; neu+=r.neutral; neg+=r.negative;
    cloud.push([r.text, Math.ceil((r.positive+1)*20)]);
    const li=document.createElement('li');
    li.className='list-group-item bg-dark text-light';
    li.textContent=r.text;
    li.style.borderLeft=`4px solid ${r.positive>r.negative?'#26a69a':'#ef5350'}`;
    list.prepend(li);
  });
  rose.data.datasets[0].data=[pos,neu,neg];
  rose.update();

  // WordCloud
  WordCloud(document.getElementById('wc-canvas'),{
    list:cloud, gridSize:10, weightFactor:1.2,
    color:'#26a69a', backgroundColor:'#202226',
    rotateRatio:0.1
  });

  document.getElementById('last-update').textContent =
    new Date().toLocaleTimeString();
}
fetchData();
setInterval(fetchData,60_000);
</script>
{% endblock %}
