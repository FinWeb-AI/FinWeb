{% extends "base.html" %}
{% block title %}蠟燭圖型態辨識 – FinWeb{% endblock %}

{% block content %}
<h1 class="mb-4">蠟燭圖型態辨識</h1>

<div class="d-flex gap-3">
  <div style="flex:6; position:relative;">
    <div class="d-flex justify-content-end mb-2 gap-2">
      <label for="img-file" class="btn btn-outline-light btn-sm">上傳圖片</label>
      <input type="file" id="img-file" accept="image/*" style="display:none;">
      <button id="cam-btn" class="btn btn-outline-success btn-sm">開啟螢幕擷取</button>
    </div>

    <canvas id="cv-canvas" class="border border-secondary"
            style="width:100%; height:480px; background:#000;"></canvas>
    <video id="cv-video" autoplay muted playsinline
           style="display:none; width:100%; height:480px; object-fit:cover;"></video>
  </div>
  <div style="flex:5; position:relative;">
    <div class="mb-2 text-end"><small class="text-muted">滑鼠移到柱子上可查看細節</small></div>

    <div id="three-container" class="border border-secondary"
         style="width:100%; height:360px; background:#111;"></div>
    <div id="three-tooltip"
         style="position:absolute; padding:6px 8px; background:rgba(0,0,0,.75);
                color:#1abc9c; font-size:13px; border-radius:4px;
                pointer-events:none; display:none;"></div>

    <div id="chart-wrapper"
         style="display:none; height:200px; margin-top:8px; background:#222;">
      <canvas id="conf-chart"></canvas>
    </div>
  </div>
  <div style="flex:5;">
    <div class="card bg-dark text-light h-100">
      <div class="card-header">偵測結果</div>
      <ul class="list-group list-group-flush" id="det-list" style="min-height:200px;"></ul>
      <div class="card-body">
        <h5>AI 建議</h5>
        <div id="ai-suggest" class="small text-white-50" style="min-height:150px;">
          請先上傳或開啟螢幕擷取偵測。
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module">

const DETECT_INTERVAL  = 800;
const CAPTURE_DURATION = 7000;

import * as THREE        from 'https://unpkg.com/three@0.152.2/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.152.2/examples/jsm/controls/OrbitControls.js';

let scene, camera, renderer, controls, raycaster, bars=[];
const mouse = new THREE.Vector2();

function initThree(){
  const ctn = document.getElementById('three-container');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, ctn.clientWidth/ctn.clientHeight, .1, 1000);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(ctn.clientWidth, ctn.clientHeight);
  ctn.appendChild(renderer.domElement);

  camera.position.set(0,5,8);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.GridHelper(10,10,0x444444,0x222222));
  const dl = new THREE.DirectionalLight(0xffffff,.8);
  dl.position.set(5,10,5);
  scene.add(dl, new THREE.AmbientLight(0x404040));

  raycaster = new THREE.Raycaster();
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('resize', ()=>{
    camera.aspect = ctn.clientWidth/ctn.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(ctn.clientWidth, ctn.clientHeight);
  });

  (function anim(){ requestAnimationFrame(anim); controls.update(); renderer.render(scene,camera);}());
}
function onPointerMove(e){
  const rect = document.getElementById('three-container').getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits = raycaster.intersectObjects(bars);
  const tip  = document.getElementById('three-tooltip');
  if(hits.length){
    const {label, conf} = hits[0].object.userData;
    tip.style.left = e.clientX+10+'px';
    tip.style.top  = e.clientY+10+'px';
    tip.textContent= `${label}：${Math.round(conf*100)}%`;
    tip.style.display='block';
  }else tip.style.display='none';
}
function updateBars(data){
  bars.forEach(b=>scene.remove(b)); bars=[];
  const gap=.7,w=.5;
  data.forEach((d,i)=>{
    const h=d.conf*3+.2;
    const geo=new THREE.BoxGeometry(w,h,w);
    const mat=new THREE.MeshStandardMaterial({color:d.conf>.75?0x1abc9c:0xf1c40f});
    const m=new THREE.Mesh(geo,mat);
    m.position.set((i-(data.length-1)/2)*gap,h/2,0);
    m.userData={label:d.label,conf:d.conf};
    scene.add(m); bars.push(m);
  });
}
initThree();

const confChart = new Chart(document.getElementById('conf-chart'),{
  type:'line',
  data:{labels:[],datasets:[{label:'平均信心',data:[],tension:.3,fill:true,
    backgroundColor:'rgba(26,188,156,.2)',borderColor:'#1abc9c',
    pointRadius:8,pointBackgroundColor:'#1abc9c',
    pointBorderColor:'#fff',pointBorderWidth:2}]},
  options:{responsive:true,maintainAspectRatio:false,
    scales:{y:{min:0,max:1,ticks:{color:'#fff'}},x:{ticks:{display:false}}},
    plugins:{legend:{labels:{color:'#fff'}}}}
});

const cvs  = document.getElementById('cv-canvas'), ctx2d=cvs.getContext('2d');
const video= document.getElementById('cv-video');
const detUl= document.getElementById('det-list'), suggest=document.getElementById('ai-suggest');
const fileIn=document.getElementById('img-file'), camBtn=document.getElementById('cam-btn');
const chartWrapper=document.getElementById('chart-wrapper');

let stream=null, collecting=false,  lastDetectTs=0, captureStart=0;
const labelConfMap = new Map();

fileIn.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const img=new Image(); img.onload=()=>drawAndDetect(img,false);
  img.src=URL.createObjectURL(f);
});

async function stopCapture(){
  if(!stream) return;
  stream.getTracks().forEach(t=>t.stop());
  stream=null; collecting=false;

  video.style.display='none'; cvs.style.display='block';
  camBtn.className='btn btn-outline-success btn-sm';
  camBtn.textContent='開啟螢幕擷取';

  const detArr=[...labelConfMap].map(([label,conf])=>({label,conf}))
                                .sort((a,b)=>b.conf-a.conf);
  labelConfMap.clear();

  if(detArr.length){
    suggest.textContent='AI 分析中…';
    await sendAiSuggest(detArr);
  }else{
    suggest.textContent='未偵測到任何型態';
  }
}

camBtn.addEventListener('click',async()=>{
  if(stream){ await stopCapture(); return; }

  try{
    stream = await navigator.mediaDevices.getDisplayMedia({video:true});
    video.srcObject=stream; video.style.display='block'; cvs.style.display='none';

    collecting=true; labelConfMap.clear(); lastDetectTs=0; captureStart=Date.now();

    camBtn.className='btn btn-danger btn-sm';
    camBtn.textContent='停止螢幕擷取 (7s)';
    suggest.textContent='螢幕擷取中…（7 秒後自動分析）';

    detectLoop();
  }catch(err){ console.error(err); alert('無法擷取螢幕畫面（需 HTTPS 或 localhost）'); }
});

function detectLoop(){
  if(!stream) return;
  const now=Date.now();
  const remain=Math.max(0,CAPTURE_DURATION-(now-captureStart));
  camBtn.textContent=`停止螢幕擷取 (${Math.ceil(remain/1000)}s)`;
  if(now-captureStart>=CAPTURE_DURATION){ stopCapture(); return; }

  if(now-lastDetectTs>DETECT_INTERVAL){
    lastDetectTs=now; drawAndDetect(video,true);
  }
  requestAnimationFrame(detectLoop);
}

async function drawAndDetect(src,isCapture){
  cvs.width=src.videoWidth||src.width; cvs.height=src.videoHeight||src.height;
  ctx2d.drawImage(src,0,0,cvs.width,cvs.height);

  let dets=[];
  try{
    const blob=await new Promise(res=>cvs.toBlob(res,'image/png'));
    const fd=new FormData(); fd.append('file',blob);
    const res=await fetch('/api/cv_detect',{method:'POST',body:fd});
    if(!res.ok){ console.warn('cv_detect',await res.text()); return; }
    dets=await res.json(); if(!Array.isArray(dets)) return;
  }catch(err){ console.error(err); return; }

  detUl.innerHTML='';
  dets.forEach(d=>{
    const [x1,y1,x2,y2]=d.bbox.map(v=>v*cvs.width);
    ctx2d.strokeStyle=d.conf>.75?'#1abc9c':'#f1c40f'; ctx2d.lineWidth=2;
    ctx2d.strokeRect(x1,y1,x2-x1,y2-y1);
    ctx2d.fillStyle='#fff'; ctx2d.font='14px sans-serif';
    ctx2d.fillText(`${d.label} ${Math.round(d.conf*100)}%`,x1+2,y1+2);

    const li=document.createElement('li');
    li.className='list-group-item bg-dark text-light d-flex justify-content-between';
    li.innerHTML=`<span>${d.label}</span><span>${Math.round(d.conf*100)}%</span>`;
    detUl.appendChild(li);
  });

  updateBars(dets);

  chartWrapper.style.display='block';
  const avg=dets.reduce((s,d)=>s+d.conf,0)/dets.length;
  if(confChart.data.labels.length>50){
    confChart.data.labels.shift(); confChart.data.datasets[0].data.shift();
  }
  confChart.data.labels.push('');
  confChart.data.datasets[0].data.push(avg); confChart.update();

  if(isCapture){
    dets.forEach(d=>{
      const prev=labelConfMap.get(d.label) || 0;
      if(d.conf>prev) labelConfMap.set(d.label,d.conf);
    });
  }else{
    suggest.textContent='AI 分析中…';
    await sendAiSuggest(dets.map(d=>({label:d.label,conf:d.conf})));
  }
}

async function sendAiSuggest(detArr){
  try{
    const r = await fetch('/api/chat',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({dets:detArr})
    });
    if(!r.ok){ suggest.textContent='AI 建議無法取得'; return; }
    const j = await r.json();
    suggest.textContent = j.reply?.trim()||'AI 無回應，請稍後再試';
  }catch(e){ console.error(e); suggest.textContent='AI 服務錯誤'; }
}
</script>
{% endblock %}
