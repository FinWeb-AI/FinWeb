{% extends "base.html" %}
{% block title %}電子郵件驗證 - FinWeb{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">電子郵件驗證</h2>
    <p>請輸入您註冊時填寫的電子郵件與 6 位數驗證碼。</p>
    <form method="post" novalidate>
      <div class="mb-3">
        <label class="form-label">電子郵件</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">驗證碼</label>
        <input name="code" class="form-control" pattern="\d{6}" placeholder="六位數" required>
      </div>
      <div class="d-grid">
        <button class="btn btn-primary">確認驗證</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
